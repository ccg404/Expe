<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expe - Finance Tracker</title>
    <meta name="theme-color" content="#F6F2E9">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
    <!-- Adding of Expenses -->
    <main id="expense-tracker">
        <section id="expense-tracker-header">
            <div class="brand">
                <h1 class="brand-title">Expe</h1>
                <p class="tagline">Track what you spend, plainly.</p>
            </div>
            <dl class="stat">
                <dt>Total Spent</dt>
                <dd id="total-spent" aria-live="polite">₱0.00</dd>
            </dl>
        </section>
        <section id="expense-tracker-body">
            <div id="button-container">
                <button type="button" id="addBtn" aria-haspopup="dialog" aria-controls="modalOverlay">Add Expense</button>
            </div>
            <section id="history">
                <p class="history-title">History</p>
                <ul id="historyList" class="history-list"></ul>
                <p id="historyEmpty" class="history-empty">No expenses yet. Add your first one to get started.</p>
            </section>
        </section>
    </main>

    <!-- Pop over target. Form for Adding expense -->
    <dialog id="modalOverlay" class="modal-overlay" aria-labelledby="modalTitle">
        <form id="entryForm" novalidate>
            <h2 id="modalTitle">Add Expense</h2>
            <fieldset>
                <legend>Expense details</legend>
                <div class="field">
                    <label for="category">Category</label>
                    <select name="category" id="category" required autocomplete="off">
                        <option value="" disabled selected>Select a category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Bills">Bills</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                    <p class="field-error" id="categoryError" hidden>Select a category.</p>
                </div>
                <div class="field">
                    <label for="amount">Amount</label>
                    <input type="number" name="amount" id="amount" required min="0.01" step="0.01"
                        inputmode="decimal" placeholder="0.00…" autocomplete="off">
                    <p class="field-error" id="amountError" hidden>Enter an amount greater than 0.</p>
                </div>
                <div class="field">
                    <label for="expenseDate">Date</label>
                    <input type="date" name="expenseDate" id="expenseDate" required autocomplete="off">
                    <p class="field-error" id="dateError" hidden>Enter a valid date.</p>
                </div>
            </fieldset>
            <div class="form-actions">
                <button type="submit" id="cancelBtn" form="cancelForm" formmethod="dialog">Cancel</button>
                <button type="submit" id="saveBtn">Save Expense</button>
            </div>
        </form>
        <form method="dialog" id="cancelForm">
            <button type="submit" id="closeXBtn" class="close-x" aria-label="Close">×</button>
        </form>
    </dialog>

    <script src="app.js"></script>
</body>
</html>
